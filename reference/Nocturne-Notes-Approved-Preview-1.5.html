/* Extra settings rows must scroll INSIDE the window, not beyond its rounded rim. */

/* Nocturne Notes: two symmetrical controls in the existing footer. */
.sidebar-footer{gap:8px;}
.sidebar-footer .add-note,.sidebar-footer .search-note{
 width:36px;height:36px;min-width:36px;min-height:36px;
 display:grid;place-items:center;padding:0;
}
.sidebar-footer .search-note svg{width:17px;height:17px;stroke-width:1.75;}
.sidebar-search{flex:0 0 auto;display:flex;flex-direction:column;gap:7px;
 padding:13px 12px 9px;border-bottom:1px solid #ffffff13;min-width:0;}
.sidebar-search input{min-width:0;width:100%;height:35px;padding:0 10px;border:1px solid #ffffff24;
 background:linear-gradient(140deg,#ffffff0e,#ffffff05);border-radius:10px;
 color:#e5e5e7;outline:0;font-size:12px;}
.sidebar-search input::placeholder{color:#88888e;}
.sidebar-search input:focus{border-color:#ffffff5b;}
.sidebar-search input[type=search]::-webkit-search-cancel-button{display:none;}
.search-entry{display:flex;min-width:0;gap:5px;}
.search-entry input{flex:1;}
.search-entry button{flex:0 0 30px;width:30px;height:35px;padding:0;display:grid;place-items:center;
 border:0;background:#ffffff0c;border-radius:9px;color:#bbb;}
.search-entry button:hover{background:#ffffff1c;color:#fff;}
.search-entry button svg{height:14px;width:14px;}
.search-actions{display:flex;gap:7px;min-width:0;}
.search-actions button{height:35px;min-width:0;flex:1;padding:0 6px;
 font-size:11px;color:#d4d4d7;border:1px solid #ffffff20;border-radius:10px;
 background:linear-gradient(140deg,#ffffff13,#ffffff08);}
.search-actions button:hover{background:#ffffff25;}
.search-actions button:disabled{opacity:.32;}
.search-count{font-size:11px;line-height:16px;color:#88888e;margin:1px 2px 0;min-height:16px;}
.sidebar.searching .note-list{padding-top:10px;}
.search-empty{font-size:12px;color:#85858a;padding:12px 4px;}
.dialog-backdrop.about-open .dialog-options{display:flex;justify-content:center;}
.about-logo{display:block;height:76px;width:76px;object-fit:cover;border-radius:18px;margin:2px auto 8px;}


/* Nocturne Notes: approved About identity and two-scope search controls. */
.sidebar-search{gap:8px;padding-top:12px;}
.search-heading{display:flex;align-items:center;justify-content:space-between;gap:9px;min-height:26px;margin-bottom:3px;}
.search-heading>span{font:450 12px/1.3 "Segoe UI Variable Text","Segoe UI",sans-serif;color:#c6c6c9;white-space:nowrap;}
.search-heading button{flex:0 0 26px;width:26px;height:26px;display:grid;place-items:center;padding:0;border:0;border-radius:8px;background:#ffffff0c;color:#bdbdc0;}
.search-heading button:hover{background:#ffffff1c;color:white;}
.search-heading button svg{height:13px;width:13px;}
.sidebar-search>#search-query,.sidebar-search>#search-replacement{display:block;width:100%;min-width:0;height:35px;min-height:35px;box-sizing:border-box;padding:0 10px;}
.search-scope{display:flex;gap:2px;min-height:32px;padding:3px;border:1px solid #ffffff1f;border-radius:10px;background:#ffffff08;}
.search-scope button{flex:1 1 0;min-width:0;height:26px;padding:0 2px;border:0;border-radius:7px;background:transparent;color:#9d9da2;font-size:11px;white-space:nowrap;}
.search-scope button.selected{background:#ffffff1d;color:#f3f3f4;box-shadow:inset 0 1px 0 #ffffff0b;}
.search-scope button:hover:not(.selected){background:#ffffff0e;color:#ddd;}
.search-actions button{white-space:nowrap;font-size:11px;}
.dialog-backdrop.about-open .glass-dialog{width:min(342px,calc(100% - 30px));}
.dialog-backdrop.about-open #dialog-heading{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.dialog-backdrop.about-open #dialog-message{display:none;}
.dialog-backdrop.about-open #dialog-options{display:flex;align-items:center;justify-content:center;margin:8px 0 19px;}
.about-identity{width:max-content;max-width:100%;display:flex;align-items:center;justify-content:center;gap:15px;margin:0 auto;}
.about-logo{display:block;flex:0 0 70px;width:70px;height:70px;object-fit:contain;border:0;border-radius:0;margin:0;}
.about-details{display:flex;flex-direction:column;gap:7px;min-width:0;}
.about-product{font-size:16px;line-height:1.2;font-weight:590;white-space:nowrap;color:#ededee;}
.about-version{font-size:12px;line-height:1.3;color:#aaaab0;white-space:nowrap;}

/* 1.4.2: non-invasive search navigation and third matching footer button. */
.sidebar-footer .save-note{width:36px;height:36px;min-width:36px;min-height:36px;display:grid;place-items:center;padding:0;}
.sidebar-footer .save-note svg{width:17px;height:17px;stroke-width:1.7;}
.search-navigation{display:flex;align-items:center;justify-content:space-between;min-height:22px;gap:7px;padding:0 1px;}
.search-counter{font-size:11px;color:#aaaab0;line-height:20px;font-variant-numeric:tabular-nums;}
.search-navigation-buttons{display:flex;align-items:center;gap:5px;}
.search-navigation-buttons button{display:grid;place-items:center;width:24px;height:23px;padding:0;border:1px solid #ffffff18;background:#ffffff0b;border-radius:7px;color:#d7d7da;}
.search-navigation-buttons button:hover:not(:disabled){background:#ffffff24;}
.search-navigation-buttons button svg{width:13px;height:13px;stroke-width:1.7;}
::highlight(nocturne-search-all){background:rgba(149,122,186,.34);color:inherit;}
::highlight(nocturne-search-current){background:rgba(168,128,208,.78);color:#fff;}
.note-title.search-title-hit{box-shadow:inset 0 -1px 0 rgba(159,130,189,.38);}
.dialog-backdrop.about-open .about-identity{display:grid;grid-template-columns:70px max-content;align-items:center;justify-content:center;column-gap:15px;width:100%;margin:0 auto;}
/* The collapsed-to-minimum 120px sidebar still accommodates three 36px controls. */
.sidebar{container-type:inline-size;}
@container (max-width:170px){.sidebar-footer{margin-left:2px;margin-right:2px;gap:3px;}}
/* A title match uses the native text-selection rendering when navigated to;
   avoid drawing a full-width underline for a substring result. */
.note-title.search-title-hit{box-shadow:none;}

/* Optical balance of the logo and text as a single centered group. */
.dialog-backdrop.about-open .about-identity{transform:translateX(-3px);}

<script>
'use strict';
// Browser-only fallback for interactive preview. It intentionally does NOT produce
// .ns files: .ns is the SQLite format handled by the Electron desktop backend.
if (!window.nocturneNotes) {
 const key='nocturnenotes-browser-preview-v1';
 const legacyKey='glassnotes-browser-preview-v1'; // Read once for migration of pre-rename browser drafts.
 const defaultSettings={fontSize:17,titleSize:'small',lineHeight:1.1,autosaveMs:60000,restoreLastProject:true,sidebarWidth:240,formatToolbarEnabled:true,saveIndicatorsEnabled:true,spellcheckEnabled:false};
 const normalizeSettings=raw=>{const v=raw||{};return {fontSize:Number.isInteger(v.fontSize)&&v.fontSize>=10&&v.fontSize<=35?v.fontSize:17,titleSize:['standard','small'].includes(v.titleSize)?v.titleSize:'small',lineHeight:(v.lineHeight===1.64?1.64:1.1),autosaveMs:[60000,180000,300000].includes(v.autosaveMs)?v.autosaveMs:60000,restoreLastProject:typeof v.restoreLastProject==='boolean'?v.restoreLastProject:true,sidebarWidth:Number.isFinite(v.sidebarWidth)?Math.max(120,Math.min(10000,Math.round(v.sidebarWidth))):240,formatToolbarEnabled:typeof v.formatToolbarEnabled==='boolean'?v.formatToolbarEnabled:true,saveIndicatorsEnabled:typeof v.saveIndicatorsEnabled==='boolean'?v.saveIndicatorsEnabled:true,spellcheckEnabled:typeof v.spellcheckEnabled==='boolean'?v.spellcheckEnabled:false};};
 const clone=o=>JSON.parse(JSON.stringify(o));
 const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'n'+Date.now()+'-'+Math.random().toString(36).slice(2);
 const seed=()=>{const n={id:uid(),title:'Без названия',html:'<p></p>'};return {projectId:uid(),name:'Без названия',path:null,isDraft:true,notes:[n],activeId:n.id};};
 let project,sidebarCollapsed=false,settings={...defaultSettings},recentSnapshots=[],previewBooted=false;
 try{const s=JSON.parse(localStorage.getItem(key)||localStorage.getItem(legacyKey));project=s.project;sidebarCollapsed=!!s.sidebarCollapsed;settings=normalizeSettings(s.settings);
  if(s.settings?.fontSize===22&&s.settings?.titleSize==='standard'&&s.settings?.lineHeight===1.64){
   settings={...settings,fontSize:17,titleSize:'small',lineHeight:1.1};
  }
  recentSnapshots=[]; /* Internal preview drafts are not real recent .ns projects. */}catch{}
 if(!project||!Array.isArray(project.notes)){project=seed();}
 // Only discard the untouched, generated four-note demo from older previews.
 // Preserve every note if the user has edited any sample content.
 const oldDemoNames=['Идеи','Планы','Ссылки','Заметки'];
 const isUntouchedDemo=project.name==='Демонстрация Nocturne Notes' &&
  project.notes.length===4 && project.notes.every((n,i)=>n.title===oldDemoNames[i] &&

  if(!needle)return [];

 };

 };

  const found=nodes.find(v=>isEnd?(pos>v.start&&pos<=v.end):(pos>=v.start&&pos<v.end));

  const last=nodes[nodes.length-1];return last?{node:last.node,offset:last.node.textContent.length}:null;
 };

   const toChange=all?titlePositions:[titlePositions[0]];
   for(const i of [...toChange].reverse())title=title.slice(0,i)+replacement+title.slice(i+query.length);

   const range=document.createRange();range.setStart(begin.node,begin.offset);range.setEnd(end.node,end.offset);
   range.deleteContents();range.insertNode(document.createTextNode(replacement));

  }

   const b=document.createElement('button');
   b.type='button';
   b.title=label;
   const span=document.createElement('span');span.className='submenu-label';span.textContent=label;

   }
   files.forEach(item=>{

  const row=anchor.getBoundingClientRect();

  refs.submenu.style.maxWidth=Math.max(104,Math.min(460,roomRight))+'px';

 function searchResultNodes(){

 function getSearchHits(){
  const q=refs.searchQuery.value.trim();if(!searchOpen||!q||!state)return [];
  const found=[];
  for(const n of state.notes){
   if(searchScope==='note'&&n.id!==state.activeId)continue;
   for(const position of window.nocturneSearch.hits(n.title||'',q))found.push({noteId:n.id,kind:'title',offset:position});
   const root=document.createElement('div');root.innerHTML=n.html||'';
   const body=window.nocturneSearch.findInElement(root,q);
   for(const position of body.positions)found.push({noteId:n.id,kind:'body',offset:position});
  }
  return found;
 }

  $('#search-close').addEventListener('click',closeSearch);
  refs.searchQuery.addEventListener('input',()=>{refreshSearchMatches({preferredIndex:0});renderList();});
  refs.searchQuery.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();void navigateSearch(e.shiftKey?-1:1)}});
  refs.searchPrevious.addEventListener('click',()=>void navigateSearch(-1));
  refs.searchNext.addEventListener('click',()=>void navigateSearch(1));
  refs.searchReplacement.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();void replaceSearchMatches(false)}});
  refs.searchReplaceOne.addEventListener('click',()=>void replaceSearchMatches(false));
  refs.searchReplaceAll.addEventListener('click',()=>void replaceSearchMatches(true));
  refs.sidebarTab.addEventListener('click',()=>toggleSidebar());
  refs.title.addEventListener('input',()=>{queueSave();if(searchOpen)refreshSearchMatches();renderList()});
  // Enter in the note title moves into the note body, without adding a line
  // break to the title or changing the document contents.
  refs.title.addEventListener('keydown',e=>{
   if(e.key!=='Enter'||e.isComposing)return;
   if(searchOpen&&refs.searchQuery.value.trim()){e.preventDefault();void navigateSearch(e.shiftKey?-1:1);return;}
   e.preventDefault();
   refs.editor.focus();
   const selection=window.getSelection();
   if(!selection)return;
   const range=document.createRange();
   range.selectNodeContents(refs.editor.firstElementChild||refs.editor);
   range.collapse(true);
   selection.removeAllRanges();selection.addRange(range);
  });
  // A native input may scroll to the end when the entire title is selected.
  // Keep its visual start fixed without disrupting partial selections or typing.
  refs.title.addEventListener('select',()=>{
   if(refs.title.selectionStart!==0||refs.title.selectionEnd!==refs.title.value.length)return;
   requestAnimationFrame(()=>{
    if(refs.title.selectionStart===0&&refs.title.selectionEnd===refs.title.value.length)
     refs.title.scrollLeft=0;
   });
  });
  refs.editor.addEventListener('input',()=>{queueSave();if(searchOpen)refreshSearchMatches();scheduleCaretBottomInset();});
  refs.editor.addEventListener('paste',e=>{e.preventDefault();const plain=e.clipboardData?.getData('text/plain')||'';document.execCommand('insertText',false,plain)});
  refs.editor.addEventListener('click',e=>{
   const a=e.target.closest('a[href]');if(a && (e.ctrlKey||e.metaKey)){e.preventDefault();window.open(a.href,'_blank','noopener,noreferrer')}
  });
  document.addEventListener('selectionchange',()=>{if(!refs.dialog.hidden)return;requestAnimationFrame(adjustToolbar)});
  refs.editor.addEventListener('keyup',()=>{adjustToolbar();scheduleCaretBottomInset();});refs.editor.addEventListener('mouseup',adjustToolbar);
  refs.scroll.addEventListener('scroll',()=>{if(!refs.toolbar.hidden)requestAnimationFrame(adjustToolbar)});
  refs.toolbar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))e.preventDefault()});
  refs.toolbar.addEventListener('click',e=>{const b=e.target.closest('[data-format]');if(b)void formatAction(b.dataset.format)});
  refs.colorPopover.addEventListener('pointerdown',e=>e.preventDefault());
  const chooseHeading=b=>{restoreRange();document.execCommand('formatBlock',false,'<'+b.dataset.heading+'>');refs.headingPopover.hidden=true;$('#heading-toggle').setAttribute('aria-expanded','false');queueSave();requestAnimationFrame(adjustToolbar)};
  refs.headingPopover.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-heading]');e.preventDefault();if(b)chooseHeading(b)});
  refs.headingPopover.addEventListener('click',e=>{const b=e.target.closest('[data-heading]');if(b&&e.detail===0)chooseHeading(b)});
  refs.colorPopover.addEventListener('click',e=>{const b=e.target.closest('[data-color]');if(!b)return;restoreRange();document.execCommand('foreColor',false,b.dataset.color);refs.colorPopover.hidden=true;queueSave();adjustToolbar()});
  refs.dialogCancel.addEventListener('click',()=>resolveDialog(false));refs.dialogConfirm.addEventListener('click',()=>resolveDialog(true));
  refs.dialogInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();resolveDialog(true)}});
  refs.dialog.addEventListener('pointerdown',e=>{if(e.target===refs.dialog)resolveDialog(false)});
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('.glass-select'))refs.dialogOptions.querySelectorAll('.glass-select-list').forEach(el=>el.hidden=true)});
  settingsControlEvents();resizeSidebar();fillFormatPopovers();
  if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>syncSidebarWidth()).observe(refs.win.querySelector('.workarea'));
  else window.addEventListener('resize',syncSidebarWidth);
  document.addEventListener('keydown',onKey);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)void flush()});
  window.addEventListener('blur',()=>{if(state)void flush()});
  $('#min-btn').addEventListener('click',async()=>{const x=await api.windowAction('minimize');if(x?.previewMessage)toast(x.previewMessage)});
  $('#max-btn').addEventListener('click',async()=>{const x=await api.windowAction('maximize');if(x?.previewMessage)toast(x.previewMessage)});
  $('#close-btn').addEventListener('click',async()=>{if(!await flush())return;const x=await api.windowAction('close');if(x?.previewMessage)toast(x.previewMessage)});
  api.onBeforeClose(async()=>{if(await flush())api.closeConfirmed()});
  api.onWindowState(v=>refs.win.classList.toggle('is-maximized',v));
  api.onProjectSwitched(p=>syncProject(p));
 }
 async function start(){
  bind();
  try{const boot=await api.bootstrap();settings={...DEFAULT_SETTINGS,...boot.settings};applySettings();syncProject(boot.project);if(boot.sidebarCollapsed)toggleSidebar(true)}
  catch(e){report(e);refs.title.value='Ошибка загрузки';refs.editor.textContent=String(e.message)}
  if(!api.isDesktop){toast('Интерактивная версия в браузере · проекты .ns — в Windows-приложении')}
  initialRender=false;
 }
 void start();
})();

</script>
</body>
